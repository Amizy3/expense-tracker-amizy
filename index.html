<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Home Budget — Expense Tracker</title>
  <meta name="description" content="Track daily expenses and income, see what you save every month. Works offline, data stays on your device.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#057a55">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home Budget">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>💰 Home Budget</h1>
    </header>

    <main>
      <section id="home-view" class="view active"></section>
      <section id="tasks-view" class="view"></section>
      <section id="history-view" class="view"></section>
      <section id="settings-view" class="view"></section>
    </main>

    <button class="fab" id="fab-add" aria-label="Add transaction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="bottom-nav">
      <button data-view="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <button data-view="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Tasks</span>
      </button>
      <button data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
        <span>History</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet" id="form-sheet">
      <div class="sheet-handle"></div>
      <h2 id="form-title">Add Transaction</h2>

      <div class="type-toggle" id="type-toggle"></div>

      <div class="field amount-field">
        <label for="f-amount">Amount</label>
        <input type="number" id="f-amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
      </div>

      <div class="field">
        <label>Category</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>

      <div class="field">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>

      <div class="field">
        <label for="f-note">Note (optional)</label>
        <textarea id="f-note" maxlength="80" placeholder="e.g. weekly groceries"></textarea>
      </div>

      <div class="sheet-actions">
        <button class="btn ghost" id="form-close">Cancel</button>
        <button class="btn primary" id="save-btn">Save</button>
      </div>
      <button class="btn danger" id="delete-btn" style="width:100%;margin-top:10px;display:none;">Delete</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
